<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Desktop Launcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 10%, #1d4ed8 0%, #0f172a 75%, #020617 100%);
      user-select: none;
      overflow: hidden;
    }
    .desktop-item {
      position: absolute;
      touch-action: none;
    }
    .desktop-item:hover {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .desktop-item:active {
      background-color: rgba(255, 255, 255, 0.22);
    }
    /* スクロールバー */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between text-white">

  <!-- 上部ツールバー -->
  <header class="bg-slate-900/70 backdrop-blur-md border-b border-white/10 px-4 py-2 flex items-center justify-between z-20 shadow-md">
    <!-- ショートカット新規作成 -->
    <form onsubmit="addShortcut(event)" class="flex items-center gap-2 flex-1 max-w-xl">
      <div class="relative flex-1">
        <i class="fa-solid fa-link absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="inputUrl" required placeholder="URL (例: docs.google.com/... や canva.com...)" 
               class="w-full bg-slate-800/90 border border-slate-700 rounded pl-8 pr-2.5 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-400">
      </div>
      <input type="text" id="inputName" placeholder="名前 (省略OK)" 
             class="w-36 bg-slate-800/90 border border-slate-700 rounded px-2.5 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-400">
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded shadow transition shrink-0 flex items-center gap-1">
        <i class="fa-solid fa-plus text-[10px]"></i> 追加
      </button>
    </form>

    <!-- フォルダ作成 & Docs一発生成ボタン -->
    <div class="flex items-center gap-2 pl-3 border-l border-white/10 ml-3">
      <button onclick="openCreateFolderModal()" class="bg-amber-600/40 hover:bg-amber-600/70 border border-amber-400/40 text-amber-200 text-xs font-bold px-2.5 py-1 rounded transition flex items-center gap-1.5">
        <i class="fa-solid fa-folder-plus text-amber-300"></i> +フォルダ
      </button>

      <span class="text-slate-600">|</span>

      <button onclick="window.open('https://docs.new', '_blank')" title="新規Docs" class="px-2 py-1 bg-blue-600/20 hover:bg-blue-600/50 border border-blue-400/30 rounded text-blue-300 text-xs transition">
        <i class="fa-solid fa-file-word"></i> +Docs
      </button>
      <button onclick="window.open('https://sheets.new', '_blank')" title="新規Sheets" class="px-2 py-1 bg-emerald-600/20 hover:bg-emerald-600/50 border border-emerald-400/30 rounded text-emerald-300 text-xs transition">
        <i class="fa-solid fa-file-excel"></i> +Sheets
      </button>

      <span class="text-slate-600">|</span>
      <button onclick="exportData()" title="バックアップ" class="text-slate-400 hover:text-white text-xs p-1"><i class="fa-solid fa-download"></i></button>
      <label title="復元" class="text-slate-400 hover:text-white text-xs p-1 cursor-pointer">
        <i class="fa-solid fa-upload"></i>
        <input type="file" onchange="importData(event)" class="hidden" accept=".json">
      </label>
    </div>
  </header>

  <!-- デスクトップ領域（自由配置エリア） -->
  <main id="desktopCanvas" class="flex-1 relative w-full h-full overflow-hidden">
    <!-- ドラッグ可能なアイコンがここに入ります -->
  </main>

  <!-- タスクバー -->
  <footer class="h-10 bg-slate-950/80 backdrop-blur-lg border-t border-white/10 px-4 flex items-center justify-between text-xs text-slate-400 z-20">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 text-blue-400 font-bold">
        <i class="fa-brands fa-windows text-sm"></i>
        <span>Desktop Workspace</span>
      </div>
      <span class="text-slate-600">|</span>
      <span id="itemCount" class="text-[11px]">0 アイテム</span>
      <span class="text-slate-500 text-[10px]">（アイコンはドラッグして好きな場所に配置できます）</span>
    </div>
    <div id="clock" class="font-mono text-slate-300 text-[11px]"></div>
  </footer>

  <!-- フォルダ中身のエクスプローラー風ウィンドウ -->
  <div id="folderWindow" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-white/20 w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <!-- フォルダウィンドウのタイトルバー -->
      <div class="px-4 py-2 bg-slate-800/90 border-b border-white/10 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-amber-400 text-sm"></i>
          <span id="folderWindowTitle" class="font-bold text-slate-200">フォルダ</span>
        </div>
        <button onclick="closeFolderWindow()" class="text-slate-400 hover:text-white hover:bg-rose-600 px-2 py-0.5 rounded transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- フォルダ内の操作バー -->
      <div class="p-3 bg-slate-950/60 border-b border-white/5 flex flex-wrap items-center justify-between gap-2">
        <!-- フォルダ内に直接URL追加 -->
        <form onsubmit="addLinkToCurrentFolder(event)" class="flex items-center gap-2 flex-1 max-w-md">
          <input type="text" id="folderInputUrl" required placeholder="このフォルダに追加するURL..." 
                 class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-400">
          <input type="text" id="folderInputName" placeholder="名前 (省略OK)" 
                 class="w-28 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-400">
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-2.5 py-1 rounded shrink-0">追加</button>
        </form>

        <!-- 一括オープンボタン -->
        <button onclick="launchAllInCurrentFolder()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3 py-1 rounded shadow flex items-center gap-1.5 shrink-0">
          <i class="fa-solid fa-bolt text-amber-300"></i>
          <span id="folderLaunchBtnText">すべて開く</span>
        </button>
      </div>

      <!-- フォルダ内のリンク一覧 -->
      <div id="folderItemList" class="p-4 overflow-y-auto flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- JSでフォルダ内のアイテムが並びます -->
      </div>
    </div>
  </div>

  <!-- 新規フォルダ作成モーダル -->
  <div id="newFolderModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-white/20 p-4 rounded-lg w-80 shadow-2xl">
      <h3 class="text-xs font-bold mb-3 text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-folder-plus text-amber-400"></i> 新規フォルダの作成
      </h3>
      <input type="text" id="newFolderName" placeholder="例: 日本史レポート, 英語プレゼン" class="w-full bg-slate-800 border border-slate-600 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-400 mb-3">
      <div class="flex justify-end gap-2">
        <button onclick="closeCreateFolderModal()" class="px-3 py-1 text-xs text-slate-400 hover:text-white">キャンセル</button>
        <button onclick="confirmCreateFolder()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs font-bold text-white">作成</button>
      </div>
    </div>
  </div>

  <script>
    // データ管理
    let desktopItems = JSON.parse(localStorage.getItem('desktop_items_v2')) || [
      { id: '1', type: 'shortcut', name: 'Google Classroom', url: 'https://classroom.google.com', x: 30, y: 30 },
      { id: '2', type: 'shortcut', name: 'Google Drive', url: 'https://drive.google.com', x: 30, y: 130 },
      { id: '3', type: 'folder', name: 'レポート課題セット', x: 30, y: 230, items: [] }
    ];

    let currentOpenFolderId = null;

    function saveToStorage() {
      localStorage.setItem('desktop_items_v2', JSON.stringify(desktopItems));
      renderDesktop();
      if (currentOpenFolderId) renderFolderWindow(currentOpenFolderId);
    }

    // URLの自動認識アイコン
    function detectType(url) {
      if (!url) return { icon: 'fa-solid fa-globe', color: 'text-blue-300', bg: 'bg-blue-500/10', defaultName: 'Web サイト' };
      if (url.includes('docs.google.com/document')) return { icon: 'fa-solid fa-file-lines', color: 'text-blue-400', bg: 'bg-blue-500/20', defaultName: 'Google ドキュメント' };
      if (url.includes('docs.google.com/spreadsheets')) return { icon: 'fa-solid fa-table', color: 'text-emerald-400', bg: 'bg-emerald-500/20', defaultName: 'Google スプレッドシート' };
      if (url.includes('docs.google.com/presentation')) return { icon: 'fa-solid fa-file-powerpoint', color: 'text-amber-400', bg: 'bg-amber-500/20', defaultName: 'Google スライド' };
      if (url.includes('canva.com')) return { icon: 'fa-solid fa-palette', color: 'text-cyan-400', bg: 'bg-cyan-500/20', defaultName: 'Canva デザイン' };
      if (url.includes('classroom.google.com')) return { icon: 'fa-solid fa-graduation-cap', color: 'text-emerald-400', bg: 'bg-emerald-500/20', defaultName: 'Classroom' };
      if (url.includes('turnitin.com')) return { icon: 'fa-solid fa-clipboard-check', color: 'text-rose-400', bg: 'bg-rose-500/20', defaultName: 'Turnitin' };
      return { icon: 'fa-solid fa-globe', color: 'text-blue-300', bg: 'bg-blue-500/10', defaultName: 'Web サイト' };
    }

    // デスクトップ描画
    function renderDesktop() {
      const canvas = document.getElementById('desktopCanvas');
      canvas.innerHTML = '';
      document.getElementById('itemCount').textContent = `${desktopItems.length} アイテム`;

      desktopItems.forEach(item => {
        const el = document.createElement('div');
        el.className = `desktop-item group flex flex-col items-center justify-start p-2 rounded-lg border border-transparent cursor-pointer transition w-24`;
        el.style.left = `${item.x || 30}px`;
        el.style.top = `${item.y || 30}px`;

        if (item.type === 'folder') {
          // フォルダアイコン
          const count = item.items ? item.items.length : 0;
          el.innerHTML = `
            <div class="relative w-12 h-12 rounded-xl flex items-center justify-center mb-1 bg-amber-500/20 border border-amber-400/30 shadow-md">
              <i class="fa-solid fa-folder text-amber-400 text-2xl"></i>
              <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-900 font-bold rounded-full text-[9px] w-4 h-4 flex items-center justify-center shadow">${count}</span>
            </div>
            <span class="text-[11px] font-medium text-slate-100 leading-tight line-clamp-2 drop-shadow break-all px-1">${item.name}</span>
            <button onclick="deleteItem('${item.id}', event)" title="削除" class="absolute -top-1 -right-1 hidden group-hover:flex bg-slate-900 border border-white/20 rounded p-1 hover:text-rose-400 text-slate-400 text-[10px] z-10">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
        } else {
          // ショートカットアイコン
          const type = detectType(item.url);
          el.innerHTML = `
            <div class="relative w-12 h-12 rounded-xl flex items-center justify-center mb-1 ${type.bg} border border-white/10 shadow-md">
              <i class="${type.icon} ${type.color} text-2xl"></i>
              <div class="absolute -bottom-0.5 -left-0.5 bg-white text-slate-900 rounded-sm w-3.5 h-3.5 flex items-center justify-center text-[8px] shadow">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </div>
            </div>
            <span class="text-[11px] font-medium text-slate-100 leading-tight line-clamp-2 drop-shadow break-all px-1" title="${item.url}">${item.name}</span>
            <button onclick="deleteItem('${item.id}', event)" title="削除" class="absolute -top-1 -right-1 hidden group-hover:flex bg-slate-900 border border-white/20 rounded p-1 hover:text-rose-400 text-slate-400 text-[10px] z-10">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
        }

        // ドラッグ & クリック制御の登録
        attachDragAndClick(el, item);
        canvas.appendChild(el);
      });
    }

    // ドラッグ＆クリック制御（ドラッグ時はリンクを開かない）
    function attachDragAndClick(el, item) {
      let isDragging = false;
      let startX, startY;
      let initialLeft, initialTop;

      el.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;

        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;

        function onMouseMove(moveEvent) {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;

          // 5px以上動いたらドラッグと判定
          if (Math.hypot(dx, dy) > 5) {
            isDragging = true;
            el.style.zIndex = 100;
            el.style.cursor = 'grabbing';

            // 自由配置
            let newX = initialLeft + dx;
            let newY = initialTop + dy;

            // 画面外にはみ出さないよう制限
            newX = Math.max(10, Math.min(window.innerWidth - 100, newX));
            newY = Math.max(10, Math.min(window.innerHeight - 150, newY));

            el.style.left = `${newX}px`;
            el.style.top = `${newY}px`;
          }
        }

        function onMouseUp(upEvent) {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          el.style.zIndex = '';
          el.style.cursor = 'pointer';

          if (isDragging) {
            // スナップ（20px刻みに吸着させて綺麗に整列）
            let finalX = Math.round(parseInt(el.style.left) / 20) * 20;
            let finalY = Math.round(parseInt(el.style.top) / 20) * 20;
            el.style.left = `${finalX}px`;
            el.style.top = `${finalY}px`;

            item.x = finalX;
            item.y = finalY;
            saveToStorage();
          } else {
            // クリック時：フォルダなら展開、ショートカットなら開く
            if (item.type === 'folder') {
              openFolderWindow(item.id);
            } else {
              window.open(item.url, '_blank');
            }
          }
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // ショートカット追加
    function addShortcut(e) {
      e.preventDefault();
      let url = document.getElementById('inputUrl').value.trim();
      let name = document.getElementById('inputName').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      if (!name) name = detectType(url).defaultName;

      // 新規アイテムの配置位置（適当に空いている場所を探す）
      const offset = (desktopItems.length * 30) % 200;
      desktopItems.push({
        id: Date.now().toString(),
        type: 'shortcut',
        name: name,
        url: url,
        x: 140 + offset,
        y: 30 + offset
      });

      document.getElementById('inputUrl').value = '';
      document.getElementById('inputName').value = '';
      saveToStorage();
    }

    // フォルダ作成モーダル
    function openCreateFolderModal() {
      document.getElementById('newFolderName').value = '';
      document.getElementById('newFolderModal').classList.remove('hidden');
      document.getElementById('newFolderName').focus();
    }
    function closeCreateFolderModal() {
      document.getElementById('newFolderModal').classList.add('hidden');
    }
    function confirmCreateFolder() {
      const name = document.getElementById('newFolderName').value.trim() || '新しいフォルダ';
      const offset = (desktopItems.length * 30) % 200;
      desktopItems.push({
        id: Date.now().toString(),
        type: 'folder',
        name: name,
        x: 140 + offset,
        y: 120 + offset,
        items: []
      });
      closeCreateFolderModal();
      saveToStorage();
    }

    // フォルダウィンドウ操作
    function openFolderWindow(folderId) {
      currentOpenFolderId = folderId;
      renderFolderWindow(folderId);
      document.getElementById('folderWindow').classList.remove('hidden');
    }
    function closeFolderWindow() {
      document.getElementById('folderWindow').classList.add('hidden');
      currentOpenFolderId = null;
    }

    function renderFolderWindow(folderId) {
      const folder = desktopItems.find(i => i.id === folderId);
      if (!folder) return closeFolderWindow();

      document.getElementById('folderWindowTitle').textContent = folder.name;
      const list = document.getElementById('folderItemList');
      list.innerHTML = '';

      const items = folder.items || [];
      document.getElementById('folderLaunchBtnText').textContent = `すべて開く (${items.length}タブ)`;

      if (items.length === 0) {
        list.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">リンクがありません。上の入力バーから追加してください。</div>`;
        return;
      }

      items.forEach(link => {
        const type = detectType(link.url);
        const card = document.createElement('div');
        card.className = `group relative bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-lg p-2.5 flex items-center justify-between cursor-pointer transition shadow`;
        card.onclick = (e) => {
          if (e.target.closest('button')) return;
          window.open(link.url, '_blank');
        };
        card.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${type.bg}">
              <i class="${type.icon} ${type.color} text-sm"></i>
            </div>
            <div class="truncate">
              <div class="text-xs font-bold text-slate-200 truncate">${link.name}</div>
              <div class="text-[10px] text-slate-400 truncate">${link.url}</div>
            </div>
          </div>
          <button onclick="deleteLinkFromFolder('${link.id}', event)" class="text-slate-500 hover:text-rose-400 text-xs p-1 ml-2 shrink-0">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        list.appendChild(card);
      });
    }

    // フォルダ内にURL追加
    function addLinkToCurrentFolder(e) {
      e.preventDefault();
      if (!currentOpenFolderId) return;

      const folder = desktopItems.find(i => i.id === currentOpenFolderId);
      if (!folder) return;

      let url = document.getElementById('folderInputUrl').value.trim();
      let name = document.getElementById('folderInputName').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      if (!name) name = detectType(url).defaultName;

      if (!folder.items) folder.items = [];
      folder.items.push({
        id: Date.now().toString(),
        name: name,
        url: url
      });

      document.getElementById('folderInputUrl').value = '';
      document.getElementById('folderInputName').value = '';
      saveToStorage();
    }

    // フォルダ内のURL一括オープン
    function launchAllInCurrentFolder() {
      if (!currentOpenFolderId) return;
      const folder = desktopItems.find(i => i.id === currentOpenFolderId);
      if (!folder || !folder.items || folder.items.length === 0) {
        alert('開くリンクがありません');
        return;
      }
      folder.items.forEach(item => window.open(item.url, '_blank'));
    }

    function deleteLinkFromFolder(linkId, e) {
      e.stopPropagation();
      const folder = desktopItems.find(i => i.id === currentOpenFolderId);
      if (folder && folder.items) {
        folder.items = folder.items.filter(l => l.id !== linkId);
        saveToStorage();
      }
    }

    // デスクトップアイテム削除
    function deleteItem(id, e) {
      e.stopPropagation();
      if (confirm('削除しますか？')) {
        desktopItems = desktopItems.filter(i => i.id !== id);
        saveToStorage();
      }
    }

    // バックアップ＆復元
    function exportData() {
      const blob = new Blob([JSON.stringify(desktopItems, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `desktop_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          desktopItems = JSON.parse(evt.target.result);
          saveToStorage();
          alert('復元が完了しました！');
        } catch (err) { alert('無効なファイルです'); }
      };
      reader.readAsText(file);
    }

    // 時計
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    renderDesktop();
  </script>
</body>
</html>
